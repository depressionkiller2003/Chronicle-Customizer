name: Customizer source checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Prepare the pinned framework and validate the patch
        run: |
          git clone https://github.com/anxiousintrovert/Chronicle-Mod-Framework.git build/framework
          git -C build/framework checkout --detach 17b20f181db2106f65d03809adc5fcc12b050cf3
          git -C build/framework apply --check "$GITHUB_WORKSPACE/framework/chronicle-customizer.patch"
          git -C build/framework apply "$GITHUB_WORKSPACE/framework/chronicle-customizer.patch"
      - name: Validate package and framework author tools
        run: |
          python3 build/framework/tools/chronicle_mod.py check mods/chronicle.customizer
          python3 -m unittest discover -s build/framework/tools/tests
      - name: Check numeric rules, story locks and tree ordering
        run: |
          clang++ -std=c++20 -I build/framework/port/src build/framework/tools/tests/customizer_numeric.cpp -o build/numeric
          clang++ -std=c++20 -I build/framework/port/src build/framework/tools/tests/customizer_weapon_tree.cpp -o build/tree
          build/numeric
          build/tree
      - name: Check the distributed Lua callbacks with vendored Lua
        shell: bash
        run: |
          sources=()
          for source in build/framework/port/third_party/lua/*.c; do
            if [[ "$source" != */luac.c ]]; then sources+=("$source"); fi
          done
          clang -O2 -DLUA_USE_LINUX "${sources[@]}" -lm -ldl -o build/lua
          build/lua build/framework/tools/tests/customizer_actions.lua "$GITHUB_WORKSPACE/mods/chronicle.customizer/main.lua"
